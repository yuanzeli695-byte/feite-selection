name: windows-validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PowerShell syntax and trap check
        shell: powershell
        run: ./tools/check-ps-syntax.ps1

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r pipeline/requirements.txt pytest

      - name: Run pipeline tests
        shell: powershell
        run: python -m pytest -q
